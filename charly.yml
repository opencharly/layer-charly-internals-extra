charly-internals-extra:
    candy:
        description: |-
            Overflow skill and agent entities for the charly-internals family (split from
            candy/charly-internals/charly.yml to stay under GitHub's 1 MiB
            contents-API cap). Each entity's prose is authored with the entity itself;
            the node in this file carries only the routing metadata its consumers read.
            The owner field stays "charly-internals" so the runtime association is
            unchanged.
        plan:
            - run: this documentation-only candy ships no install content
              command: "true"
              context:
                - build
            - check: the overflow internals skill and agent entities are present and generated into the marketplace's internals/skills and internals/agents trees
              id: charly-internals-extra-present
              context:
                - build
              command: "true"
strict-policy-skill:
    skill:
        name: strict-policy
        family: internals
        owner: charly-internals
        triggers:
            - "Agent Driven Evaluation (ADE) / `charly box feature run` / `charly check feature run` / `charly feature list/pending/validate` / authoring a candy's `plan:` + `description:` string / the agent grader for `agent-check:` steps"
            - "Engineering-discipline triggers (failure surfaced / dup pattern / ad-hoc fix tempting / \"out of scope\" framing)"
            - "Go code-quality / AGENTS.md-compliance audit / `golangci-lint` / `dupl` / duplication or dead-code check / `.golangci.yml`"
vm-spec-skill:
    skill:
        name: vm-spec
        family: internals
        owner: charly-internals
        triggers:
            - "VmSpec / libvirt / cloud-init / OVMF internals"
