charly-internals-extra:
    candy:
        description: |-
            RETIRED concept candy. It owns no `skill:` and no `agent` entity any more: the two
            skills and the six agent definitions it carried have moved beside the code,
            plugin, contract or rulebook each of them documents (opencharly/opencharly#600,
            #611), and every body is byte-identical at its destination. This repo authors no
            prose.

            It stays a real `candy:` node because a project needs one, and it carries a `true`
            no-op `run:` step and a `true` no-op `check:` step. NEITHER is an assertion: there
            is no body left here for the body-existence gate to resolve, so a step that read
            `true` would assert nothing about anything.

            The `owner:` field of the entities this repo once carried is GONE with them, which
            is the whole of opencharly/layer-charly-internals-extra#30: all eight nodes named
            `charly-internals`, the candy of a DIFFERENT repo, so the owner rule rejected every
            node before any body was considered. The issue's own text gives two legal fixes and
            forbids applying both — repair the field, or let the drain drop the nodes. The drain
            dropped them, and no field was rewritten.
        plan:
            - run: this retired concept candy ships no install content and owns no entity — a no-op, not a claim
              command: "true"
              context:
                - build
            - check: no-op — the candy owns no `skill:` or `agent` node any more, so there is no body to resolve and nothing this step could assert
              id: charly-internals-extra-retired-no-op
              context:
                - build
              command: "true"
